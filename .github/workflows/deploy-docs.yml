name: Deploy Redirect

# docs.bws.ninja is deprecated. This workflow publishes a static redirect
# stub (redirect/) that sends every path to https://www.bws.ninja/.
# The documentation build (VitePress) has been retired; the source markdown
# remains in git history.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
